<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag vital para mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerir Acessos - Administrador</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; /* Centraliza verticalmente no mobile */
            min-height: 100vh;
            margin: 0;
            padding: 20px; 
            box-sizing: border-box;
        }
        .box { 
            background: #fff; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 400px; 
        }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; font-size: 1.5rem; }
        label { font-weight: 600; display: block; margin: 15px 0 8px; color: #444; font-size: 0.9rem; }
        
        /* Ajuste de inputs para evitar zoom no iOS e melhorar o toque */
        input { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #eee; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 16px; /* Mínimo para não dar zoom no mobile */
            transition: border-color 0.3s;
        }
        input:focus { border-color: #2c3e50; outline: none; }
        
        button { 
            width: 100%; 
            padding: 16px; 
            background: #2c3e50; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer; 
            margin-top: 25px; 
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.98); background: #1a252f; }
        button:disabled { background: #95a5a6; }

        .btn-voltar { 
            display: block; 
            text-align: center; 
            margin-top: 20px; 
            text-decoration: none; 
            color: #7f8c8d; 
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Novo Acesso</h2>
    
    <label for="nome-encarregado">Nome do Encarregado:</label>
    <input type="text" id="nome-encarregado" placeholder="Ex: João Silva" autocomplete="off">
    
    <label for="novo-codigo">Código de Acesso:</label>
    <!-- inputmode numeric abre o teclado numérico no celular -->
    <input type="number" id="novo-codigo" placeholder="Ex: 5050" inputmode="numeric">

    <button id="btn-salvar" onclick="gerarAcesso()">Salvar Acesso</button>
    <a href="index.html" class="btn-voltar">← Voltar ao Painel</a>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxDYc3zZMgehcAwtVRbCUOqUjd4Ctem8i0W0f6iyFogFf02_Y9huXyiPNQInv1qSlUJ/exec";

    async function gerarAcesso() {
        const nomeInput = document.getElementById('nome-encarregado');
        const codigoInput = document.getElementById('novo-codigo');
        const btn = document.getElementById('btn-salvar');

        const nome = nomeInput.value.trim();
        const codigo = codigoInput.value.trim();

        if (!nome || !codigo) return alert("Por favor, preencha todos os campos.");

        // Feedback de carregamento
        btn.disabled = true;
        btn.innerText = "Salvando...";

        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors", // Necessário se houver erro de redirecionamento no POST
                body: JSON.stringify({
                    sistema: 'criar_acesso',
                    nomeEncarregado: nome,
                    novoCodigo: codigo
                })
            });
            
            alert("Acesso criado com sucesso!");
            nomeInput.value = "";
            codigoInput.value = "";
        } catch (e) {
            alert("Erro ao salvar acesso. Verifique sua conexão.");
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.innerText = "Salvar Acesso";
        }
    }
</script>
</body>
</html>
