<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Relatório de Sábados - Leonardo Construções</title>
    <style>
        :root {
            --success: #27ae60;
            --primary: #2e7d32;
            --light: #f4f7f6;
            --dark: #2c3e50;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--light); 
            padding: 15px; 
            margin: 0;
            color: #333;
        }

        .container { 
            max-width: 850px; 
            margin: auto; 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }

        h2 { 
            color: var(--success); 
            text-align: center; 
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }

        /* Seção de Filtros por Data */
        .filtro-container {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .campo-filtro {
            flex: 1;
            min-width: 160px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .campo-filtro label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
        }

        .campo-filtro input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .campo-filtro input:focus {
            border-color: var(--success);
        }

        .btn-filtrar {
            background: var(--success);
            color: white;
            border: none;
            padding: 11px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
            min-width: 120px;
        }

        .btn-filtrar:hover {
            background: #219653;
        }

        /* Resumo em Card */
        .resumo { 
            background: #e8f5e9; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border-left: 6px solid var(--success);
            box-shadow: 0 2px 8px rgba(39, 174, 96, 0.1);
        }

        .resumo h4 { 
            margin: 0 0 12px 0; 
            color: var(--primary); 
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grid corrigido e ativo */
        .contagem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            font-size: 0.95rem;
        }

        .item-contagem {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #c8e6c9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ESTILO DOS AVATARES */
        .foto-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #c8e6c9;
            background: #fafafa;
            flex-shrink: 0;
        }

        .foto-lista {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #eee;
            background: #fafafa;
            flex-shrink: 0;
        }

        .col-func {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Tabela */
        .table-wrapper { overflow-x: auto; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px;
            min-width: 500px;
        }

        th { 
            text-align: left; 
            background: #f8f9fa; 
            padding: 15px; 
            border-bottom: 2px solid #dee2e6;
            color: #666;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        td { 
            padding: 10px 15px; 
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.95rem;
            vertical-align: middle;
        }

        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #f1f8f1; }

        .tag-obra { 
            background: #e8f5e9; 
            color: var(--primary); 
            padding: 5px 10px; 
            border-radius: 6px; 
            font-size: 0.8gram; 
            font-weight: bold; 
            border: 1px solid #c8e6c9;
            display: inline-block;
        }

        .btn-voltar { 
            display: inline-block; 
            margin-bottom: 20px; 
            text-decoration: none; 
            color: #777; 
            font-weight: bold;
            font-size: 0.9rem;
        }

        #status-msg { text-align: center; padding: 40px; color: #888; }
        .contagem-grid{display: none;}
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-voltar">← Painel Principal</a>
    <h2>Histórico de Sábados</h2>

    <!-- Interface dos Filtros -->
    <div class="filtro-container">
        <div class="campo-filtro">
            <label for="dataInicio">Data Inicial:</label>
            <input type="date" id="dataInicio">
        </div>
        <div class="campo-filtro">
            <label for="dataFim">Data Final:</label>
            <input type="date" id="dataFim">
        </div>
        <button class="btn-filtrar" onclick="carregarRelatorio()">Filtrar</button>
    </div>

    <div id="resumo-equipe" class="resumo">
        <h4>📊 Total de Presenças Extras:</h4>
        <div id="contagem-lista" class="contagem-grid">Carregando resumo...</div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Funcionário</th>
                    <th>Obra / Local</th>
                </tr>
            </thead>
            <tbody id="tabela-sabado">
                <!-- Dados via JS -->
            </tbody>
        </table>
        <div id="status-msg">Buscando registros...</div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxDYc3zZMgehcAwtVRbCUOqUjd4Ctem8i0W0f6iyFogFf02_Y9huXyiPNQInv1qSlUJ/exec";

    async function carregarRelatorio() {
        const tabela = document.getElementById('tabela-sabado');
        const resumo = document.getElementById('contagem-lista');
        const msg = document.getElementById('status-msg');

        // Captura os valores digitados nos inputs de data
        const dataInicio = document.getElementById('dataInicio').value;
        const dataFim = document.getElementById('dataFim').value;

        // Reseta os estados visuais enquanto busca novos dados filtrados
        tabela.innerHTML = "";
        resumo.innerText = "Atualizando resumo...";
        msg.style.display = 'block';
        msg.innerText = "Buscando registros...";

        try {
            // Constrói a URL passando os parâmetros se eles estiverem preenchidos
            let urlCompleta = `${API_URL}?tipo=relatorioSabado`;
            if (dataInicio) urlCompleta += `&dataInicio=${dataInicio}`;
            if (dataFim) urlCompleta += `&dataFim=${dataFim}`;

            const res = await fetch(urlCompleta);
            const dados = await res.json();
            msg.style.display = 'none';

            if (!dados || dados.length === 0) {
                tabela.innerHTML = "<tr><td colspan='3' style='text-align:center; padding: 30px;'>Nenhum registro de sábado encontrado para o período selecionado.</td></tr>";
                resumo.innerText = "Sem dados para exibir.";
                return;
            }

            // Inverter para mostrar os mais recentes primeiro
            dados.sort((a, b) => new Date(b.data) - new Date(a.data));

            // Cálculo do resumo acumulado por funcionário mantendo as fotos vinculadas
            const contagem = {};
            dados.forEach(d => {
                if (!contagem[d.nome]) {
                    contagem[d.nome] = { total: 0, foto: d.foto };
                }
                contagem[d.nome].total += 1;
            });

            // Exibe o painel superior com micro-fotos e totais atualizados conforme o filtro
            resumo.innerHTML = Object.entries(contagem)
                .map(([nome, info]) => `
                    <div class="item-contagem">
                        <img src="${info.foto}" class="foto-avatar" alt="Mini foto" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
                        <div>
                            <strong>${nome}</strong>
                            <div style="font-size: 12px; color: #666;">${info.total} ${info.total === 1 ? 'dia' : 'dias'}</div>
                        </div>
                    </div>
                `).join('');

            // Preenche as linhas da tabela principal
            tabela.innerHTML = dados.map(d => {
                let dataBR = "Data inválida";
                if (d.data) {
                    const dataObj = new Date(d.data);
                    dataBR = dataObj.toLocaleDateString('pt-BR', {timeZone: 'UTC'});
                }
                
                return `
                    <tr>
                        <td><b>${dataBR}</b></td>
                        <td>
                            <div class="col-func">
                                <img src="${d.foto}" class="foto-lista" alt="Foto de ${d.nome}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
                                <span>${d.nome}</span>
                            </div>
                        </td>
                        <td><span class="tag-obra">${d.obra || 'Frente Geral'}</span></td>
                    </tr>
                `;
            }).join('');

        } catch (e) {
            msg.innerText = "Erro ao conectar com o banco de dados.";
            msg.style.color = "red";
            resumo.innerText = "Erro ao carregar dados.";
            console.error(e);
        }
    }

    // Executa uma primeira busca completa ao abrir a tela
    carregarRelatorio();
</script>
</body>
</html>
