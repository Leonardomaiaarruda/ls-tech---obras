<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag essencial para evitar zoom e garantir escala correta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de Obras - Alocação</title>
    <style>
        :root {
            --primary: #1a73e8;
            --success: #27ae60;
            --bg: #f0f2f5;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            margin: 0;
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box;
        }

        h2 { color: var(--primary); text-align: center; margin: 10px 0 20px; font-size: 1.4rem; }
        
        label { display: block; margin-top: 15px; font-weight: 600; color: #444; margin-bottom: 8px; font-size: 0.95rem; }
        
        /* Select maior para facilitar o toque */
        select { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 2px solid #eee; 
            font-size: 16px; 
            background-color: #fff;
            appearance: none; /* Remove seta padrão em alguns browsers */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 1em;
        }

        #container-func { 
            max-height: 50vh; /* Altura relativa à tela do celular */
            overflow-y: auto; 
            border: 2px solid #eee; 
            border-radius: 12px; 
            padding: 8px; 
            background: #fafafa;
        }

        /* Item de lista otimizado para o polegar */
        .func-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 8px; 
            padding: 12px; 
            background: white; 
            border-radius: 10px; 
            border: 1px solid #eee;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .func-item:active { background: #f0f7ff; }

        .func-item img { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--success); 
            background-color: #eee;
        }

        .func-info { 
            display: flex; 
            align-items: center; 
            flex-grow: 1; 
            cursor: pointer; 
            user-select: none;
        }

        /* Checkbox maior */
        .func-info input { 
            margin-right: 15px; 
            width: 22px;
            height: 22px;
            cursor: pointer; 
        }

        .func-info span { font-weight: 600; color: #333; font-size: 1rem; }

        button { 
            width: 100%; 
            padding: 18px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            margin-top: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.2);
        }
        
        button:active { transform: scale(0.98); }
        button:disabled { background: #ccc; box-shadow: none; }

        #status { 
            margin-top: 15px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 0.9rem;
            min-height: 24px; 
        }

        .btn-voltar { 
            display: inline-block; 
            margin-bottom: 10px; 
            text-decoration: none; 
            color: #666; 
            font-weight: bold; 
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <a href="index.html" class="btn-voltar">← Painel Principal</a>
        <h2>Realocação de Equipe</h2>
        
        <label>1. Obra Destino:</label>
        <select id="select-obras">
            <option>Carregando obras...</option>
        </select>

        <label>2. Funcionários:</label>
        <div id="container-func">
            <p style="color: #888; text-align: center; padding: 20px;">Carregando equipe...</p>
        </div>

        <button id="btn-confirmar" onclick="salvarAlocacao()">Confirmar Realocação</button>
        <div id="status"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxDYc3zZMgehcAwtVRbCUOqUjd4Ctem8i0W0f6iyFogFf02_Y9huXyiPNQInv1qSlUJ/exec";

        async function carregarDados() {
            const containerFunc = document.getElementById('container-func');
            const selectObras = document.getElementById('select-obras');
            const status = document.getElementById('status');

            try {
                const [resObras, resFunc] = await Promise.all([
                    fetch(API_URL + "?tipo=obras"),
                    fetch(API_URL + "?tipo=faltas")
                ]);

                const obras = await resObras.json();
                const funcs = await resFunc.json();

                if (obras.length > 0) {
                    selectObras.innerHTML = obras.map(o => `<option value="${o}">${o}</option>`).join('');
                } else {
                    selectObras.innerHTML = "<option>Nenhuma obra cadastrada</option>";
                }

                if (funcs.length > 0) {
                    containerFunc.innerHTML = funcs.map(f => `
                        <div class="func-item">
                            <img src="${f.foto}" 
                                 referrerpolicy="no-referrer"
                                 onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
                            <label class="func-info" for="chk-${f.name}">
                                <input type="checkbox" name="func-alocacao" id="chk-${f.name}" value="${f.name}">
                                <span>${f.name}</span>
                            </label>
                        </div>
                    `).join('');
                } else {
                    containerFunc.innerHTML = "<p style='text-align:center; padding: 20px;'>Nenhum funcionário encontrado.</p>";
                }

            } catch (e) {
                status.innerText = "Erro ao carregar dados.";
                status.style.color = "red";
            }
        }

        async function salvarAlocacao() {
            const obra = document.getElementById('select-obras').value;
            const selecionados = Array.from(document.querySelectorAll('input[name="func-alocacao"]:checked')).map(i => i.value);
            const status = document.getElementById('status');
            const btn = document.getElementById('btn-confirmar');

            if (!obra || obra.includes("Carregando") || obra.includes("Nenhuma")) {
                return alert("Selecione uma obra válida.");
            }
            if (selecionados.length === 0) return alert("Selecione ao menos um funcionário.");

            btn.disabled = true;
            status.style.color = "#f39c12";
            status.innerText = "Processando...";
            
            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify({
                        sistema: 'alocacao',
                        obra: obra,
                        funcionarios: selecionados
                    })
                });

                status.style.color = "green";
                status.innerText = `✔ ${selecionados.length} movidos para ${obra}`;
                
                document.querySelectorAll('input[name="func-alocacao"]:checked').forEach(el => el.checked = false);

                // Feedback visual de sucesso rápido
                setTimeout(() => { status.innerText = ""; }, 3000);

            } catch (e) {
                status.style.color = "red";
                status.innerText = "Erro ao salvar dados.";
            } finally {
                btn.disabled = false;
            }
        }

        carregarDados();
    </script>
</body>
</html>
