<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Faltas - Leonardo Construções</title>
    <style>
        :root {
            --danger: #d32f2f;
            --dark: #2c3e50;
            --light: #f4f7f6;
            --selected: #fff1f0;
            --border: #eee;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--light); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            padding: 15px; 
        }

        .box { 
            background: #fff; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
            box-sizing: border-box;
        }

        h2 { color: var(--danger); text-align: center; margin-top: 0; margin-bottom: 20px; }

        label { font-weight: 600; color: var(--dark); display: block; margin-bottom: 8px; font-size: 0.9rem; }

        input[type="date"] { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            font-size: 16px; 
            margin-bottom: 20px; 
            box-sizing: border-box;
            background: #fff;
            color: #333;
        }

        /* CONFIGURAÇÃO DA LISTA COM FOTOS */
        .lista-equipe { 
            border: 2px solid var(--border); 
            border-radius: 12px; 
            background: #fafafa;
            margin-bottom: 20px;
            max-height: 380px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }

        .item-func { 
            display: flex; 
            align-items: center; 
            padding: 12px 15px; 
            border-bottom: 1px solid var(--border); 
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }

        .item-func.selecionado {
            background-color: var(--selected);
        }

        .item-func:last-child { border-bottom: none; }

        /* ESTILO DA FOTO DE PERFIL */
        .foto-perfil {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid #ddd;
            background-color: #eee;
        }

        .item-func.selecionado .foto-perfil {
            border-color: var(--danger);
        }

        input[type="checkbox"] { 
            width: 22px; 
            height: 22px; 
            margin-right: 10px; 
            accent-color: var(--danger);
            cursor: pointer;
        }

        .nome-func { 
            font-size: 16px; 
            color: #333; 
            font-weight: 500;
            flex-grow: 1;
            user-select: none;
        }

        button { 
            width: 100%; 
            padding: 18px; 
            background: var(--danger); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.2);
            transition: 0.3s;
        }

        button:active { transform: scale(0.98); }
        button:disabled { background: #999; cursor: not-allowed; }

        .btn-voltar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-voltar { 
            text-decoration: none; 
            color: #666; 
            font-weight: 600;
            font-size: 0.9rem;
        }

        #msg { text-align: center; font-weight: bold; margin-top: 15px; min-height: 20px; }
    </style>
</head>
<body>

<div class="box">
    <div class="btn-voltar-container">
        <a href="index.html" class="btn-voltar">← Painel</a>
        <span style="font-size: 0.8rem; color: #999;" id="exibe-autor"></span>
    </div>

    <h2>Registro de Faltas</h2>
    
    <label>Data da Falta:</label>
    <input type="date" id="data-falta">

    <label>Quem Faltou?</label>
    <div class="lista-equipe" id="func-list">
        <p style="padding: 20px; text-align: center; color: #888;">Carregando equipe...</p>
    </div>

    <button id="btn-salvar" onclick="salvarFaltas()">Salvar Faltas</button>
    <p id="msg"></p>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxDYc3zZMgehcAwtVRbCUOqUjd4Ctem8i0W0f6iyFogFf02_Y9huXyiPNQInv1qSlUJ/exec";

    document.getElementById('data-falta').value = new Date().toISOString().split('T')[0];
    const autorLogado = localStorage.getItem('nomeUsuario') || "Não identificado";
    document.getElementById('exibe-autor').innerText = "Por: " + autorLogado;

    async function carregarFuncionarios() {
        try {
            const res = await fetch(API_URL + "?tipo=faltas"); 
            const funcs = await res.json();
            const listaDiv = document.getElementById('func-list');
            
            listaDiv.innerHTML = funcs.map(f => `
                <div class="item-func" id="row-${f.name}" onclick="toggleCheckbox('${f.name}')">
                    <img src="${f.foto || 'https://via.placeholder.com/45?text=...'}" class="foto-perfil" alt="Foto de ${f.name}">
                    <input type="checkbox" id="${f.name}" value="${f.name}" onclick="event.stopPropagation(); atualizarEstilo(this)">
                    <span class="nome-func">${f.name}</span>
                </div>
            `).join('');
        } catch (e) {
            document.getElementById('msg').innerText = "Erro ao carregar equipe.";
            document.getElementById('msg').style.color = "red";
        }
    }

    function toggleCheckbox(id) {
        const cb = document.getElementById(id);
        if (cb) {
            cb.checked = !cb.checked;
            atualizarEstilo(cb);
        }
    }

    function atualizarEstilo(checkbox) {
        const row = document.getElementById('row-' + checkbox.id);
        if (checkbox.checked) {
            row.classList.add('selecionado');
        } else {
            row.classList.remove('selecionado');
        }
    }

    async function salvarFaltas() {
        const dataInput = document.getElementById('data-falta').value;
        const selecionados = Array.from(document.querySelectorAll('input:checked')).map(i => i.value);
        const statusMsg = document.getElementById('msg');
        const btn = document.getElementById('btn-salvar');

        if (selecionados.length === 0) return alert("Selecione ao menos um funcionário.");

        btn.disabled = true;
        btn.innerText = "Enviando...";
        statusMsg.innerText = "Aguarde, salvando dados...";
        statusMsg.style.color = "#f39c12";

        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    sistema: 'faltas',
                    dataUsuario: dataInput.split('-').reverse().join('/'),
                    faltas: selecionados,
                    autor: autorLogado
                })
            });
            
            statusMsg.style.color = "green";
            statusMsg.innerText = "✔ Faltas registradas com sucesso!";
            
            setTimeout(() => {
                location.reload();
            }, 1500);

        } catch (e) { 
            alert("Erro ao salvar. Verifique sua conexão.");
            btn.disabled = false;
            btn.innerText = "Salvar Faltas";
            statusMsg.innerText = "";
        }
    }

    carregarFuncionarios();
</script>
</body>
</html>
