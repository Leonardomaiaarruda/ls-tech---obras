<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Geral de Faltas - Leonardo Construções</title>
    <style>
        :root {
            --danger: #d32f2f;
            --primary: #1976d2;
            --dark: #2c3e50;
            --light: #f4f7f6;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--light); 
            padding: 15px; 
            margin: 0;
            color: #333;
        }

        .container { 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }

        h2 { 
            color: var(--danger); 
            text-align: center; 
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        /* Contador de Faltas Estilizado */
        .contador { 
            background: var(--danger); 
            color: white; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 25px; 
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.2);
        }

        /* Tabela Responsiva */
        .table-wrapper { overflow-x: auto; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            min-width: 500px;
        }

        th { 
            background-color: #f8f9fa; 
            color: #666; 
            text-align: left; 
            padding: 15px; 
            border-bottom: 2px solid #dee2e6;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td { 
            padding: 14px 15px; 
            border-bottom: 1px solid #f0f0f0; 
            font-size: 0.95rem;
        }

        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #f1f4f8; }

        /* Estilo da Obra */
        .tag-obra { 
            background: #e3f2fd; 
            color: var(--primary); 
            padding: 5px 10px; 
            border-radius: 6px; 
            font-size: 0.8rem; 
            font-weight: bold;
            border: 1px solid #bbdefb;
            display: inline-block;
        }

        .btn-voltar { 
            display: inline-block; 
            margin-bottom: 20px; 
            text-decoration: none; 
            color: #777; 
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .btn-voltar:hover { color: var(--dark); }

        #loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-voltar">← Painel Principal</a>
    <h2>Relatório de Faltas</h2>
    
    <div id="total" class="contador">Calculando faltas...</div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Funcionário</th>
                    <th>Obra / Frente</th>
                </tr>
            </thead>
            <tbody id="tabela-faltas">
                <!-- Dados carregados via JS -->
            </tbody>
        </table>
        <div id="loading">Buscando dados no servidor...</div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxDYc3zZMgehcAwtVRbCUOqUjd4Ctem8i0W0f6iyFogFf02_Y9huXyiPNQInv1qSlUJ/exec";

    async function carregarRelatorio() {
        const tabela = document.getElementById('tabela-faltas');
        const contador = document.getElementById('total');
        const loading = document.getElementById('loading');
        
        try {
            const res = await fetch(API_URL + "?tipo=relatorioFaltas");
            const faltas = await res.json();
            loading.style.display = 'none';

            if (!faltas || faltas.length === 0) {
                tabela.innerHTML = "<tr><td colspan='3' style='text-align:center; padding: 30px; color: #999;'>Nenhuma falta registrada até o momento.</td></tr>";
                contador.innerText = "Total: 0 faltas";
                return;
            }

            // Ordena por data (mais recente primeiro)
            faltas.sort((a, b) => new Date(b.data) - new Date(a.data));

            contador.innerText = `Total Acumulado: ${faltas.length} faltas`;

            tabela.innerHTML = faltas.map(f => {
                // Formatação robusta de data
                let dataFormatada = "Data inválida";
                if (f.data) {
                    const d = new Date(f.data);
                    // Adiciona compensação de fuso horário se necessário ou usa toLocaleDateString
                    dataFormatada = d.toLocaleDateString('pt-BR', {timeZone: 'UTC'});
                }

                return `
                    <tr>
                        <td><strong>${dataFormatada}</strong></td>
                        <td>${f.nome}</td>
                        <td><span class="tag-obra">${f.obra || 'Geral / Não alocado'}</span></td>
                    </tr>
                `;
            }).join('');

        } catch (e) {
            loading.style.display = 'none';
            tabela.innerHTML = "<tr><td colspan='3' style='text-align:center; color:red; padding: 20px;'>Erro ao carregar dados do Google Sheets.</td></tr>";
            contador.innerText = "Erro na conexão";
        }
    }

    carregarRelatorio();
</script>
</body>
</html>
