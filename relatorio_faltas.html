<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Relatório Geral de Faltas - Leonardo Construções</title>
    <style>
        :root {
            --danger: #d32f2f;
            --primary: #1976d2;
            --dark: #2c3e50;
            --light: #f4f7f6;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--light); 
            padding: 15px; 
            margin: 0;
            color: #333;
        }

        .container { 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }

        h2 { 
            color: var(--danger); 
            text-align: center; 
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }

        /* Área de Filtros */
        .filtro-container {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .campo-filtro {
            flex: 1;
            min-width: 160px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .campo-filtro label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
        }

        .campo-filtro input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .campo-filtro input:focus {
            border-color: var(--primary);
        }

        .btn-filtrar {
            background: var(--primary);
            color: white;
            border: none;
            padding: 11px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
            min-width: 120px;
        }

        .btn-filtrar:hover {
            background: #1565c0;
        }

        .contador { 
            background: var(--danger); 
            color: white; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 25px; 
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.2);
        }

        .table-wrapper { overflow-x: auto; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            min-width: 550px;
        }

        th { 
            background-color: #f8f9fa; 
            color: #666; 
            text-align: left; 
            padding: 15px; 
            border-bottom: 2px solid #dee2e6;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td { 
            padding: 10px 15px; 
            border-bottom: 1px solid #f0f0f0; 
            font-size: 0.95rem;
            vertical-align: middle;
        }

        .foto-lista {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #eee;
            background: #fafafa;
            flex-shrink: 0;
        }

        .col-func {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #f1f4f8; }

        .tag-obra { 
            background: #e3f2fd; 
            color: var(--primary); 
            padding: 5px 10px; 
            border-radius: 6px; 
            font-size: 0.8rem; 
            font-weight: bold;
            border: 1px solid #bbdefb;
            display: inline-block;
        }

        .btn-voltar { 
            display: inline-block; 
            margin-bottom: 20px; 
            text-decoration: none; 
            color: #777; 
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .btn-voltar:hover { color: var(--dark); }

        #loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-voltar">← Painel Principal</a>
    <h2>Relatório de Faltas</h2>
    
    <!-- Nova Interface de Filtro por Período -->
    <div class="filtro-container">
        <div class="campo-filtro">
            <label for="dataInicio">Data de Início:</label>
            <input type="date" id="dataInicio">
        </div>
        <div class="campo-filtro">
            <label for="dataFim">Data Final:</label>
            <input type="date" id="dataFim">
        </div>
        <button class="btn-filtrar" onclick="carregarRelatorio()">Filtrar</button>
    </div>
    
    <div id="total" class="contador">Calculando faltas...</div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Funcionário</th>
                    <th>Obra / Frente</th>
                </tr>
            </thead>
            <tbody id="tabela-faltas">
                <!-- Dados carregados via JS -->
            </tbody>
        </table>
        <div id="loading">Buscando dados no servidor...</div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxDYc3zZMgehcAwtVRbCUOqUjd4Ctem8i0W0f6iyFogFf02_Y9huXyiPNQInv1qSlUJ/exec";

    async function carregarRelatorio() {
        const tabela = document.getElementById('tabela-faltas');
        const contador = document.getElementById('total');
        const loading = document.getElementById('loading');
        
        // Pega os valores atuais dos inputs
        const dataInicio = document.getElementById('dataInicio').value;
        const dataFim = document.getElementById('dataFim').value;

        // Limpa a tabela e exibe o carregamento ao filtrar novamente
        tabela.innerHTML = "";
        loading.style.display = 'block';
        contador.innerText = "Filtrando registros...";

        try {
            // Constrói a URL injetando os parâmetros dinamicamente se estiverem preenchidos
            let urlDestino = `${API_URL}?tipo=relatorioFaltas`;
            if (dataInicio) urlDestino += `&dataInicio=${dataInicio}`;
            if (dataFim) urlDestino += `&dataFim=${dataFim}`;

            const res = await fetch(urlDestino);
            const faltas = await res.json();
            loading.style.display = 'none';

            if (!faltas || faltas.length === 0) {
                tabela.innerHTML = "<tr><td colspan='3' style='text-align:center; padding: 30px; color: #999;'>Nenhuma falta registrada no período selecionado.</td></tr>";
                contador.innerText = "Total: 0 faltas";
                return;
            }

            // Ordena colocando as datas mais recentes no topo
            faltas.sort((a, b) => new Date(b.data) - new Date(a.data));
            contador.innerText = `Total Encontrado: ${faltas.length} faltas`;

            tabela.innerHTML = faltas.map(f => {
                let dataFormatada = "Data inválida";
                if (f.data) {
                    const d = new Date(f.data);
                    dataFormatada = d.toLocaleDateString('pt-BR', {timeZone: 'UTC'});
                }

                return `
                    <tr>
                        <td><strong>${dataFormatada}</strong></td>
                        <td>
                            <div class="col-func">
                                <img src="${f.foto}" class="foto-lista" alt="Foto de ${f.nome}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
                                <span>${f.nome}</span>
                            </div>
                        </td>
                        <td><span class="tag-obra">${f.obra || 'Geral / Não alocado'}</span></td>
                    </tr>
                `;
            }).join('');

        } catch (e) {
            loading.style.display = 'none';
            tabela.innerHTML = "<tr><td colspan='3' style='text-align:center; color:red; padding: 20px;'>Erro ao carregar dados do Google Sheets.</td></tr>";
            contador.innerText = "Erro na conexão";
            console.error(e);
        }
    }

    // Carrega o relatório completo logo na abertura da página (sem filtros)
    carregarRelatorio();
</script>
</body>
</html>
